<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CATalyze — Cat Mood Demo</title>
<style>
  :root {
    --bg: #FFF8F0;
    --card: #FFFFFF;
    --accent: #FFCBA4;
    --accent-dark: #F5A76A;
    --text: #3A3A3A;
    --text-light: #7A7A7A;
    --border: #F2E0CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 760px; }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 4px 0;
    font-weight: 700;
  }
  .subtitle {
    color: var(--text-light);
    margin: 0 0 28px 0;
    font-size: 0.95rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .upload-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type=file] {
    flex: 1;
    min-width: 200px;
    padding: 10px;
    border: 1px dashed var(--accent-dark);
    border-radius: 10px;
    background: #FFFDFB;
  }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    border: none;
    border-radius: 10px;
    padding: 11px 22px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  #analyzeBtn {
    background: var(--accent-dark);
    color: white;
  }
  #analyzeBtn:hover { background: #EE9752; }
  #analyzeBtn:disabled { background: #E8D9C8; cursor: not-allowed; }
  .samples {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sample-thumb {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s ease;
  }
  .sample-thumb:hover { border-color: var(--accent-dark); }
  .samples-label {
    font-size: 0.85rem;
    color: var(--text-light);
    width: 100%;
    margin-bottom: 2px;
  }
  #resultSection { display: none; }
  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 600px) {
    .results-grid { grid-template-columns: 1fr; }
  }
  .image-panel { position: relative; }
  .image-panel canvas, .image-panel img.gradcam-img {
    width: 100%;
    border-radius: 12px;
    display: block;
    background: #eee;
  }
  .toggle-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    justify-content: center;
  }
  .toggle-btn {
    background: #FFF3E6;
    color: var(--text);
    font-size: 0.82rem;
    padding: 6px 14px;
  }
  .toggle-btn.active {
    background: var(--accent-dark);
    color: white;
  }
  .bar-row {
    margin-bottom: 14px;
  }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .bar-track {
    height: 14px;
    background: #FFF3E6;
    border-radius: 8px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    border-radius: 8px;
    width: 0%;
    transition: width 0.5s ease;
  }
  .status {
    font-size: 0.9rem;
    color: var(--text-light);
    margin-top: 12px;
    min-height: 1.2em;
  }
  .status.error { color: #C0553C; }
  footer {
    text-align: center;
    color: var(--text-light);
    font-size: 0.8rem;
    margin-top: 24px;
  }
  footer a { color: var(--accent-dark); }
</style>
</head>
<body>
<main>
  <h1>🐾 CATalyze</h1>
  <p class="subtitle">Upload a cat photo — real predictions from the trained keypoint + mood-CNN + calibrated-ensemble pipeline.</p>

  <div class="card">
    <div class="upload-row">
      <input type="file" id="fileInput" accept="image/*" />
      <button id="analyzeBtn" disabled>Analyze</button>
    </div>
    <div class="samples">
      <div class="samples-label">Or try a sample:</div>
      <img class="sample-thumb" src="samples/alert.jpg" data-sample="alert.jpg" title="ALERT example" />
      <img class="sample-thumb" src="samples/anxious.jpg" data-sample="anxious.jpg" title="ANXIOUS example" />
      <img class="sample-thumb" src="samples/playful.jpg" data-sample="playful.jpg" title="PLAYFUL example" />
      <img class="sample-thumb" src="samples/relaxed.jpg" data-sample="relaxed.jpg" title="RELAXED example" />
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="resultSection">
    <div class="results-grid">
      <div class="image-panel">
        <canvas id="keypointCanvas"></canvas>
        <img id="gradcamImg" class="gradcam-img" style="display:none" />
        <div class="toggle-row">
          <button class="toggle-btn active" id="btnKeypoints">Keypoints</button>
          <button class="toggle-btn" id="btnBoxes">Boxes</button>
          <button class="toggle-btn" id="btnGradcam">Grad-CAM</button>
        </div>
      </div>
      <div id="bars"></div>
    </div>
  </div>

  <div class="card">
    <div class="upload-row">
      <button id="liveBtn">Start Live Camera</button>
      <span class="status" id="liveStatus"></span>
    </div>
    <div id="livePanel" style="display:none; margin-top:14px;">
      <div class="image-panel">
        <video id="liveVideo" autoplay playsinline muted style="display:none"></video>
        <canvas id="liveCanvas" style="width:100%; border-radius:12px; background:#000;"></canvas>
      </div>
      <div id="liveBars" style="margin-top:14px;"></div>
    </div>
  </div>

  <footer id="metricsFooter"></footer>
</main>

<script>
const API_BASE = ""; // same origin
const classes = ["ALERT", "ANXIOUS", "PLAYFUL", "RELAXED"];
const statusEl = document.getElementById("status");
const analyzeBtn = document.getElementById("analyzeBtn");
const fileInput = document.getElementById("fileInput");
const resultSection = document.getElementById("resultSection");
const canvas = document.getElementById("keypointCanvas");
const gradcamImg = document.getElementById("gradcamImg");
const btnKeypoints = document.getElementById("btnKeypoints");
const btnBoxes = document.getElementById("btnBoxes");
const btnGradcam = document.getElementById("btnGradcam");

let currentFile = null;
let currentImageURL = null;
let currentPredictData = null;

function setStatus(msg, isError) {
  statusEl.textContent = msg || "";
  statusEl.className = "status" + (isError ? " error" : "");
}

async function fileFromSample(name) {
  const resp = await fetch("samples/" + name);
  const blob = await resp.blob();
  return new File([blob], name, { type: blob.type || "image/jpeg" });
}

document.querySelectorAll(".sample-thumb").forEach((el) => {
  el.addEventListener("click", async () => {
    const name = el.dataset.sample;
    setStatus("Loading sample…");
    currentFile = await fileFromSample(name);
    currentImageURL = URL.createObjectURL(currentFile);
    analyzeBtn.disabled = false;
    setStatus('Sample "' + name.replace(".jpg", "") + '" loaded. Click Analyze.');
  });
});

fileInput.addEventListener("change", () => {
  if (fileInput.files && fileInput.files[0]) {
    currentFile = fileInput.files[0];
    currentImageURL = URL.createObjectURL(currentFile);
    analyzeBtn.disabled = false;
    setStatus("Image selected. Click Analyze.");
  }
});

function drawKeypoints(imageURL, keypoints) {
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    ctx.fillStyle = "rgba(255,90,50,0.9)";
    keypoints.forEach((kp) => {
      ctx.beginPath();
      ctx.arc(kp.x, kp.y, Math.max(3, img.width * 0.01), 0, 2 * Math.PI);
      ctx.fill();
    });
  };
  img.src = imageURL;
}

function drawBoxes(imageURL, boxes) {
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    ctx.lineWidth = Math.max(2, img.width * 0.004);
    ctx.font = Math.max(12, img.width * 0.022) + "px sans-serif";
    ctx.textBaseline = "bottom";
    const colors = { left_ear: "#FF5A32", right_ear: "#3298FF", face: "#3ECF6E" };
    Object.entries(boxes).forEach(([name, b]) => {
      const color = colors[name] || "#FF5A32";
      ctx.strokeStyle = color;
      ctx.strokeRect(b.x_min, b.y_min, b.x_max - b.x_min, b.y_max - b.y_min);
      const label = `${name} ${(b.confidence * 100).toFixed(0)}%`;
      const textY = Math.max(b.y_min, 14);
      const metrics = ctx.measureText(label);
      ctx.fillStyle = color;
      ctx.fillRect(b.x_min, textY - 14, metrics.width + 8, 16);
      ctx.fillStyle = "#fff";
      ctx.fillText(label, b.x_min + 4, textY + 1);
    });
  };
  img.src = imageURL;
}

function renderBars(predictions) {
  const barsDiv = document.getElementById("bars");
  barsDiv.innerHTML = "";
  const sorted = classes.slice().sort((a, b) => predictions[b] - predictions[a]);
  sorted.forEach((cls) => {
    const pct = (predictions[cls] * 100).toFixed(1);
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <div class="bar-label"><span>${cls}</span><span>${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    `;
    barsDiv.appendChild(row);
  });
}

function setActiveToggle(btn) {
  [btnKeypoints, btnBoxes, btnGradcam].forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
}
function showKeypointsView() {
  canvas.style.display = "block";
  gradcamImg.style.display = "none";
  setActiveToggle(btnKeypoints);
  if (currentPredictData) drawKeypoints(currentImageURL, currentPredictData.keypoints);
}
function showBoxesView() {
  canvas.style.display = "block";
  gradcamImg.style.display = "none";
  setActiveToggle(btnBoxes);
  if (currentPredictData) drawBoxes(currentImageURL, currentPredictData.boxes);
}
function showGradcamView() {
  canvas.style.display = "none";
  gradcamImg.style.display = "block";
  setActiveToggle(btnGradcam);
}
btnKeypoints.addEventListener("click", showKeypointsView);
btnBoxes.addEventListener("click", showBoxesView);
btnGradcam.addEventListener("click", showGradcamView);

analyzeBtn.addEventListener("click", async () => {
  if (!currentFile) return;
  analyzeBtn.disabled = true;
  setStatus("Running keypoint + mood CNN + ensemble pipeline…");
  resultSection.style.display = "none";

  try {
    const fd1 = new FormData();
    fd1.append("file", currentFile);
    const predictResp = await fetch(API_BASE + "/predict", { method: "POST", body: fd1 });
    if (!predictResp.ok) {
      const err = await predictResp.json().catch(() => ({}));
      throw new Error(err.detail || ("predict failed: " + predictResp.status));
    }
    const predictData = await predictResp.json();

    const fd2 = new FormData();
    fd2.append("file", currentFile);
    const gradcamResp = await fetch(API_BASE + "/gradcam", { method: "POST", body: fd2 });
    let gradcamData = null;
    if (gradcamResp.ok) {
      gradcamData = await gradcamResp.json();
    }

    currentPredictData = predictData;
    renderBars(predictData.predictions);
    if (gradcamData) {
      gradcamImg.src = "data:image/png;base64," + gradcamData.overlay_png_base64;
    }
    showKeypointsView();
    resultSection.style.display = "block";
    setStatus("Done.");
  } catch (e) {
    setStatus(String(e.message || e), true);
  } finally {
    analyzeBtn.disabled = false;
  }
});

// --- Live camera (Section 2): streams webcam frames to /ws/live over a
// WebSocket, one JPEG-encoded frame per message, server replies with one
// JSON prediction (smoothed keypoints/boxes/predictions or
// cat_detected:false) per frame. Frames are sent only after the previous
// response arrives (no queuing), so the achieved rate is the server's real
// per-frame throughput, not an arbitrary client-side timer.
const liveBtn = document.getElementById("liveBtn");
const liveStatus = document.getElementById("liveStatus");
const livePanel = document.getElementById("livePanel");
const liveVideo = document.getElementById("liveVideo");
const liveCanvas = document.getElementById("liveCanvas");
const liveBars = document.getElementById("liveBars");
let liveStream = null;
let liveWs = null;
let liveRunning = false;
let liveFrameCount = 0;
let liveFpsWindowStart = 0;

function wsURL(path) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return `${proto}//${location.host}${path}`;
}

function drawLiveFrame(result) {
  const ctx = liveCanvas.getContext("2d");
  liveCanvas.width = liveVideo.videoWidth;
  liveCanvas.height = liveVideo.videoHeight;
  ctx.drawImage(liveVideo, 0, 0, liveCanvas.width, liveCanvas.height);

  if (!result.cat_detected) {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, liveCanvas.width, 34);
    ctx.fillStyle = "#fff";
    ctx.font = "18px sans-serif";
    ctx.fillText("no cat detected", 10, 23);
    liveBars.innerHTML = "";
    return;
  }

  const colors = { left_ear: "#FF5A32", right_ear: "#3298FF", face: "#3ECF6E" };
  ctx.lineWidth = Math.max(2, liveCanvas.width * 0.004);
  ctx.font = "14px sans-serif";
  Object.entries(result.boxes).forEach(([name, b]) => {
    const color = colors[name] || "#FF5A32";
    ctx.strokeStyle = color;
    ctx.strokeRect(b.x_min, b.y_min, b.x_max - b.x_min, b.y_max - b.y_min);
  });
  ctx.fillStyle = "rgba(255,90,50,0.9)";
  result.keypoints.forEach((kp) => {
    ctx.beginPath();
    ctx.arc(kp.x, kp.y, 4, 0, 2 * Math.PI);
    ctx.fill();
  });
  renderBarsInto(liveBars, result.predictions);
}

function renderBarsInto(container, predictions) {
  container.innerHTML = "";
  const sorted = classes.slice().sort((a, b) => predictions[b] - predictions[a]);
  sorted.forEach((cls) => {
    const pct = (predictions[cls] * 100).toFixed(1);
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <div class="bar-label"><span>${cls}</span><span>${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    `;
    container.appendChild(row);
  });
}

async function sendFrameLoop() {
  if (!liveRunning || !liveWs || liveWs.readyState !== WebSocket.OPEN) return;
  const off = document.createElement("canvas");
  off.width = liveVideo.videoWidth;
  off.height = liveVideo.videoHeight;
  off.getContext("2d").drawImage(liveVideo, 0, 0);
  off.toBlob(
    (blob) => {
      if (!blob || !liveRunning || liveWs.readyState !== WebSocket.OPEN) return;
      blob.arrayBuffer().then((buf) => {
        if (liveRunning && liveWs.readyState === WebSocket.OPEN) liveWs.send(buf);
      });
    },
    "image/jpeg",
    0.8
  );
}

async function startLive() {
  try {
    liveStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  } catch (e) {
    liveStatus.textContent = "Camera access denied or unavailable: " + (e.message || e);
    liveStatus.className = "status error";
    return;
  }
  liveVideo.srcObject = liveStream;
  await liveVideo.play();
  livePanel.style.display = "block";

  liveWs = new WebSocket(wsURL("/ws/live"));
  liveWs.binaryType = "arraybuffer";
  liveFrameCount = 0;
  liveFpsWindowStart = performance.now();

  liveWs.onopen = () => {
    liveRunning = true;
    liveBtn.textContent = "Stop Live Camera";
    liveStatus.textContent = "Connected. Streaming…";
    liveStatus.className = "status";
    sendFrameLoop();
  };
  liveWs.onmessage = (ev) => {
    const result = JSON.parse(ev.data);
    drawLiveFrame(result);
    liveFrameCount++;
    const elapsed = (performance.now() - liveFpsWindowStart) / 1000;
    if (elapsed >= 1.0) {
      const fps = (liveFrameCount / elapsed).toFixed(1);
      liveStatus.textContent = `Streaming — ${fps} FPS` + (result.cat_detected ? "" : " (no cat detected)");
      liveFrameCount = 0;
      liveFpsWindowStart = performance.now();
    }
    sendFrameLoop(); // send next frame only after this one's result arrives
  };
  liveWs.onerror = () => {
    liveStatus.textContent = "WebSocket error.";
    liveStatus.className = "status error";
  };
  liveWs.onclose = () => {
    liveRunning = false;
  };
}

function stopLive() {
  liveRunning = false;
  if (liveWs) { liveWs.close(); liveWs = null; }
  if (liveStream) { liveStream.getTracks().forEach((t) => t.stop()); liveStream = null; }
  livePanel.style.display = "none";
  liveBtn.textContent = "Start Live Camera";
  liveStatus.textContent = "";
}

liveBtn.addEventListener("click", () => {
  if (liveRunning) stopLive();
  else startLive();
});

// Real metrics from reports/metrics.json via the API — never hardcoded.
(async () => {
  try {
    const resp = await fetch(API_BASE + "/metrics");
    if (!resp.ok) return;
    const data = await resp.json();
    const acc = data?.ensemble?.seed_labeled_only_calibrated_accuracy;
    const n = data?.ensemble?.n_test_seed_labeled;
    if (acc != null) {
      document.getElementById("metricsFooter").textContent =
        `Ensemble seed-labeled-only accuracy: ${(acc * 100).toFixed(1)}% (n=${n}) — from reports/metrics.json`;
    }
  } catch (e) { /* metrics footer is optional */ }
})();
</script>
</body>
</html>
